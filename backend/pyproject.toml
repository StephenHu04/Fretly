[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fretly-backend"
version = "0.1.0"
description = "Fretly audio pipeline and tablature engine"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "soundfile>=0.12,<0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ffmpeg: requires ffmpeg/ffprobe on PATH (skipped automatically when missing)",
]
